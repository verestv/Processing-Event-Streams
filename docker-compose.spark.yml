name: hw10-spark

services:
  spark-master:
    image: apache/spark:3.5.5
    container_name: hw10-spark-master
    hostname: spark-master
    restart: unless-stopped
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./spark-apps:/opt/spark-apps
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080 > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - hw10-stream-net

  spark-worker:
    image: apache/spark:3.5.5
    container_name: hw10-spark-worker
    hostname: spark-worker
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      --webui-port 8081
      --cores 2
      --memory 4G
      spark://spark-master:7077
    ports:
      - "8081:8081"
    volumes:
      - ./spark-apps:/opt/spark-apps
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081 > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - hw10-stream-net

networks:
  hw10-stream-net:
    external: true